<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>UniEventos AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: black; }

    #video {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
    #ui {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      z-index: 10; color: white;
      font-family: 'Segoe UI', sans-serif;
      pointer-events: none;
    }
    #llegada {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,255,136,0.15);
      border: 2px solid #00ff88; border-radius: 20px;
      padding: 24px 36px; color: #00ff88;
      font-size: 24px; font-weight: bold;
      text-align: center; z-index: 20;
      display: none; backdrop-filter: blur(8px);
      animation: pulsar 0.5s ease-in-out infinite alternate;
    }
    @keyframes pulsar {
      from { box-shadow: 0 0 10px #00ff88; }
      to   { box-shadow: 0 0 30px #00ff88; }
    }
    #debug {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); color: lime;
      font-family: monospace; font-size: 10px;
      padding: 6px; z-index: 99;
      max-height: 22vh; overflow-y: auto;
    }
    #reticle {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 22px; height: 22px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%; z-index: 5; pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div style="font-weight:bold;font-size:18px;">🎯 UniEventos AR</div>
    <div id="status" style="font-size:12px;opacity:0.85;">Iniciando...</div>
  </div>
  <div id="reticle"></div>
  <div id="llegada"></div>
  <div id="debug"></div>

  <script>
    // ════════════════════════════════════════════════════
    // CONFIGURACIÓN
    // ════════════════════════════════════════════════════
    const API_URL      = 'https://unieventos-s25a.onrender.com/eventos/ar';
    const DIST_MAXIMA  = 500;   // metros — máximo visible
    const RADIO_MUNDO  = 10;    // unidades Three.js — radio de la esfera de indicadores

    // EMA (Exponential Moving Average) para suavizar el heading de la brújula.
    // 0 = máximo suavizado (muy lento), 1 = sin suavizado (instantáneo pero ruidoso).
    // 0.08 ≈ τ 250ms a 50Hz — suave y sin lag perceptible al girar normalmente.
    const EMA_HEADING = 0.08;
    const EMA_PITCH   = 0.15;   // pitch se puede suavizar menos

    // Umbral de llegada con holgura para GPS (~10-15m de precisión típica)
    const DIST_LLEGADA_BASE = 20;  // metros — dispara llegada

    // ════════════════════════════════════════════════════
    // ESTADO
    // ════════════════════════════════════════════════════
    let miLat = null, miLng = null, gpsAccuracy = 999;
    let eventosData     = [];
    let llegadaMostrada = {};

    // Orientación suavizada (grados)
    let smoothHeading   = null;   // null = no inicializado aún
    let smoothPitch     = 90;     // 90° = teléfono vertical apuntando al frente
    let sensorActivo    = false;

    let renderer, scene, camera;
    let indicadores = [];
    let frameCount  = 0;

    // ════════════════════════════════════════════════════
    // UTILIDADES
    // ════════════════════════════════════════════════════
    function log(msg) {
      const d = document.getElementById('debug');
      d.innerHTML += msg + '<br>';
      d.scrollTop = d.scrollHeight;
    }

    /** Diferencia corta entre dos ángulos en grados (resultado: -180 a 180) */
    function diffAngDeg(a, b) {
      return ((a - b + 540) % 360) - 180;
    }

    // ════════════════════════════════════════════════════
    // CÁMARA TRASERA
    // ════════════════════════════════════════════════════
    async function iniciarCamara() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: 'environment' } }, audio: false
        });
        document.getElementById('video').srcObject = stream;
        log('Cámara OK');
      } catch {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }, audio: false
          });
          document.getElementById('video').srcObject = stream;
          log('Cámara fallback OK');
        } catch (e2) { log('ERROR cámara: ' + e2.message); }
      }
    }

    // ════════════════════════════════════════════════════
    // GPS
    // ════════════════════════════════════════════════════
    function iniciarGPS() {
      if (!navigator.geolocation) { log('GPS no soportado'); return; }
      navigator.geolocation.watchPosition(pos => {
        miLat       = pos.coords.latitude;
        miLng       = pos.coords.longitude;
        gpsAccuracy = pos.coords.accuracy || 999;
        log(`GPS: ±${gpsAccuracy.toFixed(0)}m`);
        actualizarHUD();
      }, err => {
        log(`GPS ERR ${err.code}: ${err.message}`);
        if (err.code !== 1) {
          navigator.geolocation.getCurrentPosition(p => {
            miLat = p.coords.latitude; miLng = p.coords.longitude;
            gpsAccuracy = p.coords.accuracy || 999;
          }, () => {}, { enableHighAccuracy: false, timeout: 60000, maximumAge: 30000 });
        }
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    }

    // ════════════════════════════════════════════════════
    // ORIENTACIÓN — EMA sobre deviceorientationabsolute
    //
    // DECISIÓN: NO usar giroscopio (devicemotion).
    // Motivo: rotationRate en Android varía el mapeo de ejes según fabricante
    // (Xiaomi, Samsung) y acumula ruido rápidamente. Con EMA sobre
    // deviceorientationabsolute conseguimos suficiente suavidad SIN el ruido
    // de integración del giroscopio.
    //
    // La CLAVE arquitectónica se mantiene:
    //   → Los meshes tienen posición FIJA en el mundo (bearing absoluto).
    //   → La CÁMARA rota con el heading. Así los indicadores no "arrastran".
    // ════════════════════════════════════════════════════
    function iniciarSensores() {
      const handler = (e) => {
        if (e.alpha === null || e.alpha === undefined) return;
        sensorActivo = true;

        // Heading desde alpha de Android (antihorario → negamos para obtener CW desde Norte)
        const rawHeading = (360 - e.alpha) % 360;

        // Pitch: beta = 0° phone vertical, 90° phone flat.
        // Cuando el usuario apunta al frente con el teléfono vertical: beta ≈ 0.
        // Añadimos 90° para que la cámara Three.js mire al horizonte por defecto.
        const rawPitch = e.beta || 0;

        if (smoothHeading === null) {
          // Primera muestra — inicializar sin suavizado
          smoothHeading = rawHeading;
          smoothPitch   = rawPitch;
          return;
        }

        // EMA circular para heading (evita saltos en torno a 0°/360°)
        const dH       = diffAngDeg(rawHeading, smoothHeading);
        smoothHeading  = (smoothHeading + EMA_HEADING * dH + 360) % 360;

        // EMA lineal para pitch
        smoothPitch   += EMA_PITCH * (rawPitch - smoothPitch);
      };

      // Preferir evento absoluto (calibrado al Norte magnético)
      let absolutoActivo = false;
      window.addEventListener('deviceorientationabsolute', (e) => {
        if (e.alpha !== null) { absolutoActivo = true; handler(e); }
      }, true);

      // Fallback: deviceorientation sin garantía de absoluto
      window.addEventListener('deviceorientation', (e) => {
        if (!absolutoActivo) handler(e);
      }, true);

      log('Sensor orientación OK');
    }

    // ════════════════════════════════════════════════════
    // THREE.JS
    // ════════════════════════════════════════════════════
    function iniciarThree() {
      const canvas = document.getElementById('canvas');
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // limitar a 2x para rendimiento
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);

      scene  = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
      camera.position.set(0, 0, 0); // cámara siempre en el origen
      scene.add(camera);

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });

      log('Three.js OK');
    }

    // ════════════════════════════════════════════════════
    // TARJETA DE EVENTO (CanvasTexture)
    // ════════════════════════════════════════════════════
    function dibujarCard(ctx, evento, dist) {
      const w = 512, h = 280;
      ctx.clearRect(0, 0, w, h);
      const cerca = dist !== null && dist < 60;

      ctx.fillStyle = 'rgba(15,15,46,0.93)';
      ctx.beginPath(); ctx.roundRect(4, 4, w-8, h-8, 20); ctx.fill();

      ctx.strokeStyle = cerca ? '#00ff88' : '#6c63ff';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect(4, 4, w-8, h-8, 20); ctx.stroke();

      ctx.fillStyle = cerca ? '#00ff88' : '#6c63ff';
      ctx.fillRect(4, 4, w-8, 10);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(evento.titulo, w/2, 68);

      ctx.fillStyle = '#a0a0ff';
      ctx.font = '22px sans-serif';
      ctx.fillText(`📍 ${evento.lugar_nombre}`, w/2, 110);

      ctx.fillStyle = '#80ffcc';
      ctx.font = '20px sans-serif';
      ctx.fillText(`🕐 ${evento.hora_inicio.slice(0,5)} - ${evento.hora_fin.slice(0,5)}`, w/2, 150);

      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 28px sans-serif';
      const txt = dist === null ? '...'
        : dist < 1000 ? `${Math.round(dist)} m`
        : `${(dist/1000).toFixed(1)} km`;
      ctx.fillText(txt, w/2, 205);
    }

    // ════════════════════════════════════════════════════
    // INDICADORES — posición fija en el espacio mundo
    // ════════════════════════════════════════════════════
    function crearIndicadores() {
      eventosData.forEach(evento => {
        const canvasTex = document.createElement('canvas');
        canvasTex.width = 512; canvasTex.height = 280;
        const ctx = canvasTex.getContext('2d');
        dibujarCard(ctx, evento, null);

        const texture = new THREE.CanvasTexture(canvasTex);
        const mesh    = new THREE.Mesh(
          new THREE.PlaneGeometry(3, 1.6),
          new THREE.MeshBasicMaterial({
            map: texture, transparent: true,
            side: THREE.DoubleSide, depthWrite: false
          })
        );
        mesh.userData = { evento, texture, canvasTex, ctx };
        mesh.visible  = false;
        scene.add(mesh);
        indicadores.push(mesh);
      });
      log(`${indicadores.length} indicadores creados`);
    }

    // ════════════════════════════════════════════════════
    // CÁLCULOS GPS
    // ════════════════════════════════════════════════════
    function calcularDistancia(lat2, lng2) {
      if (miLat === null) return null;
      const R    = 6371000;
      const dLat = (lat2 - miLat) * Math.PI / 180;
      const dLng = (lng2 - miLng) * Math.PI / 180;
      const a    = Math.sin(dLat/2)**2 +
                   Math.cos(miLat*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
                   Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    /** Retorna bearing en GRADOS (0=Norte, 90=Este), absoluto */
    function calcularBearing(lat2, lng2) {
      if (miLat === null) return 0;
      const dLng  = (lng2 - miLng) * Math.PI / 180;
      const lat1r = miLat * Math.PI / 180;
      const lat2r = lat2  * Math.PI / 180;
      const y = Math.sin(dLng) * Math.cos(lat2r);
      const x = Math.cos(lat1r)*Math.sin(lat2r) - Math.sin(lat1r)*Math.cos(lat2r)*Math.cos(dLng);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // ════════════════════════════════════════════════════
    // HUD
    // ════════════════════════════════════════════════════
    function actualizarHUD() {
      const h = smoothHeading !== null ? smoothHeading.toFixed(0) : '?';
      document.getElementById('status').textContent =
        `GPS ±${gpsAccuracy.toFixed(0)}m | Heading: ${h}° | Sensor: ${sensorActivo ? '✓' : '⏳'}`;
    }

    // ════════════════════════════════════════════════════
    // LOOP PRINCIPAL
    // ════════════════════════════════════════════════════
    const eulerCamara = new THREE.Euler(0, 0, 0, 'YXZ');

    function animar() {
      requestAnimationFrame(animar);
      frameCount++;

      // ── Rotar la CÁMARA con la orientación suavizada ──────────────────
      //
      //  YXZ = yaw primero, luego pitch, luego roll (correcto para FPS/AR)
      //
      //  smoothHeading: 0=Norte, 90=Este (igual que brújula)
      //  Three.js Y+: girar a la izquierda  → negamos el heading
      //
      //  smoothPitch: beta deviceorientation
      //    beta=0   → teléfono vertical → miramos al horizonte → X = 0 en Three.js
      //    beta=90  → teléfono horizontal → miramos al suelo   → X = -90° en Three.js
      //  Conversión: eulerX = -(beta) * PI/180
      //  (sin restar 90, porque beta=0 ya es teléfono vertical = mirando al frente)

      if (smoothHeading !== null) {
        eulerCamara.y = -smoothHeading * Math.PI / 180;
        eulerCamara.x = -smoothPitch   * Math.PI / 180;
        eulerCamara.z = 0;
        camera.quaternion.setFromEuler(eulerCamara);
      }

      // ── Actualizar indicadores (posición FIJA en el espacio mundo) ──
      indicadores.forEach(mesh => {
        const { evento, texture, ctx } = mesh.userData;
        const dist    = calcularDistancia(evento.latitud, evento.longitud);
        const bearing = calcularBearing(evento.latitud, evento.longitud); // grados absolutos

        // Redibujar tarjeta cada ~45 frames (≈cada 750ms a 60fps)
        if (frameCount % 45 === 0) {
          dibujarCard(ctx, evento, dist);
          texture.needsUpdate = true;
        }

        // Debug cada 90 frames
        if (frameCount % 90 === 0 && dist !== null) {
          log(`${evento.titulo.slice(0,10)}: ${dist.toFixed(0)}m | B:${bearing.toFixed(0)}° | H:${smoothHeading ? smoothHeading.toFixed(0) : '?'}°`);
        }

        // Ocultar si fuera de rango
        if (dist === null || dist > DIST_MAXIMA) { mesh.visible = false; return; }

        // Umbral de llegada: adaptar si la precisión GPS es baja
        const umbralLlegada = Math.max(DIST_LLEGADA_BASE, gpsAccuracy * 0.8);
        if (dist < umbralLlegada) {
          mesh.visible = false;
          if (!llegadaMostrada[evento.id]) {
            llegadaMostrada[evento.id] = true;
            const div = document.getElementById('llegada');
            div.innerHTML = `✅ ¡Llegaste!<br><span style="font-size:18px">${evento.titulo}</span>`;
            div.style.display = 'block';
            setTimeout(() => { div.style.display = 'none'; delete llegadaMostrada[evento.id]; }, 5000);
          }
          return;
        }

        mesh.visible = true;

        // Radio visual: eventos lejanos aparecen en el borde de la esfera,
        // cercanos se acercan al centro (todos a la misma distancia visual = RADIO_MUNDO)
        const radio = RADIO_MUNDO;

        // POSICIÓN EN EL MUNDO con bearing ABSOLUTO (no relativo al heading).
        // bearing=0° → Norte → en Three.js Z negativo (eje -Z es "al frente" por defecto).
        // bearing=90° → Este → X positivo.
        const bearingRad = bearing * Math.PI / 180;
        const x = Math.sin(bearingRad) * radio;
        const z = -Math.cos(bearingRad) * radio;
        const y = 0; // altura neutra en el horizonte

        mesh.position.set(x, y, z);

        // Billboard: la tarjeta siempre mira a la cámara (que está en el origen)
        // Usamos la dirección desde el mesh hacia el origen para el lookAt
        mesh.lookAt(0, 0, 0);
      });

      renderer.render(scene, camera);

      if (frameCount % 90 === 0) actualizarHUD();
    }

    // ════════════════════════════════════════════════════
    // CARGAR EVENTOS
    // ════════════════════════════════════════════════════
    async function cargarEventos() {
      try {
        log('Cargando eventos...');
        const res = await fetch(API_URL);
        eventosData = await res.json();
        log(`${eventosData.length} eventos cargados`);
        if (eventosData.length === 0)
          document.getElementById('status').textContent = 'Sin eventos hoy';
      } catch (err) {
        log('ERROR API: ' + err.message);
      }
    }

    // ════════════════════════════════════════════════════
    // INIT
    // ════════════════════════════════════════════════════
    async function init() {
      log('Iniciando UniEventos AR...');
      await iniciarCamara();
      iniciarGPS();
      iniciarSensores();
      iniciarThree();
      await cargarEventos();
      crearIndicadores();
      animar();
      log('Listo ✓');
    }

    init();
  </script>
</body>
</html>
