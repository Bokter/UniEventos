<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>UniEventos AR</title>

    <!-- Mantiene tu stack: Three.js r128 + GyroNorm desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gyronorm@2.0.6/dist/gyronorm.complete.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            overscroll-behavior: none;
            touch-action: none;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            background: #000;
        }

        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px 80px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
            z-index: 10;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            pointer-events: none;
        }

        #titulo {
            font-weight: 800;
            font-size: 18px;
            text-shadow: 0 1px 4px #000;
        }

        #status {
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.9;
            line-height: 1.35;
            text-shadow: 0 1px 4px #000;
        }

        #acciones {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 24vh;
            display: none;
            gap: 8px;
            z-index: 30;
            pointer-events: auto;
        }

        .btn-secundario {
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            padding: 10px 12px;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }

        #btn-iniciar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 20px 34px;
            font-size: 18px;
            font-weight: 800;
            z-index: 40;
            cursor: pointer;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        #llegada {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 24px 36px;
            color: #00ff88;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            z-index: 35;
            display: none;
            text-shadow: 0 1px 4px #000;
            animation: pulsar 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulsar {
            from {
                box-shadow: 0 0 10px #00ff88;
            }

            to {
                box-shadow: 0 0 30px #00ff88;
            }
        }

        #debug {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.86);
            color: #78ff78;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            line-height: 1.3;
            padding: 6px;
            z-index: 99;
            max-height: 22vh;
            overflow-y: auto;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <div id="titulo">🎯 UniEventos AR</div>
        <div id="status">Toca para iniciar</div>
    </div>

    <button id="btn-iniciar">🎯 Iniciar UniEventos AR</button>

    <div id="acciones">
        <button id="btn-calibrar-evento" class="btn-secundario">📍 Calibrar con evento</button>
        <button id="btn-calibrar-norte" class="btn-secundario">🧭 Apunto al norte</button>
        <button id="btn-reset" class="btn-secundario">↺ Reset</button>
    </div>

    <div id="llegada"></div>
    <div id="debug"></div>

    <script>
        'use strict';

        // ─────────────────────────────────────────────────────────────
        // CONFIGURACIÓN
        // ─────────────────────────────────────────────────────────────
        const API_URL = 'https://unieventos-s25a.onrender.com/eventos/ar';

        const DIST_MAXIMA = 500;              // metros
        const DIST_LLEGADA_BASE = 20;         // metros
        const ALTURA_CAMARA = 1.60;           // metros simulados
        const ALTURA_INDICADOR = 1.70;        // metros simulados
        const GPS_MIN_MOVEMENT = 2.5;         // metros mínimos para aceptar movimiento GPS
        const GPS_MAX_ACCURACY_TO_TRUST = 80; // si es mayor, se acepta pero se reporta como baja calidad
        const ORIENTATION_SLERP = 0.15;       // 0.2 = más suave, 0.55 = más reactivo
        const COMPASS_CORRECTION_GAIN = 0.012;// corrección lenta de norte
        const MAX_COMPASS_JUMP = 35;          // grados, ignora saltos bruscos
        const EARTH_RADIUS = 6378137;         // WGS84 aprox.

        // ─────────────────────────────────────────────────────────────
        // ESTADO GLOBAL
        // ─────────────────────────────────────────────────────────────
        let renderer, scene, camera;
        let eventosData = [];
        let indicadores = [];
        let llegadaMostrada = {};
        let frameCount = 0;
        let animacionIniciada = false;

        // GPS crudo y filtrado
        let rawLat = null;
        let rawLng = null;
        let miLat = null;
        let miLng = null;
        let gpsAccuracy = 999;
        let originLat = null;
        let originLng = null;
        let ultimoLogGPS = 0;

        // Orientación
        let orientationAvailable = false;
        let lastAbsoluteOrientationMs = 0;
        let orientationSource = 'sin orientación';
        let deviceAlpha = null;
        let deviceBeta = null;
        let deviceGamma = null;
        let compassHeading = null; // true north en iOS si existe webkitCompassHeading
        let alphaOffsetRad = Number(localStorage.getItem('unieventos_alphaOffsetRad') || 0);
        let lastCompassCorrectionMs = 0;
        let lastHeadingDeg = 0;
        let screenOrientationDeg = getScreenOrientationDeg();
        let gnInstance = null;

        // Objetos reutilizables para no crear basura por frame
        const zee = new THREE.Vector3(0, 0, 1);
        const orientationEuler = new THREE.Euler();
        const q0 = new THREE.Quaternion();
        const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
        const qTarget = new THREE.Quaternion();
        const tmpVec3 = new THREE.Vector3();

        // ─────────────────────────────────────────────────────────────
        // UTILIDADES
        // ─────────────────────────────────────────────────────────────
        function $(id) {
            return document.getElementById(id);
        }

        function log(msg) {
            const d = $('debug');
            const lines = d.innerHTML.split('<br>');
            if (lines.length > 90) {
                d.innerHTML = lines.slice(lines.length - 80).join('<br>');
            }
            d.innerHTML += msg + '<br>';
            d.scrollTop = d.scrollHeight;
        }

        function setStatus(msg) {
            $('status').textContent = msg;
        }

        function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
        }

        function wrap360(a) {
            return ((a % 360) + 360) % 360;
        }

        function diffAngDeg(a, b) {
            return ((a - b + 540) % 360) - 180;
        }

        function degToRad(deg) {
            return deg * Math.PI / 180;
        }

        function radToDeg(rad) {
            return rad * 180 / Math.PI;
        }

        function getScreenOrientationDeg() {
            if (screen.orientation && typeof screen.orientation.angle === 'number') {
                return screen.orientation.angle;
            }
            if (typeof window.orientation === 'number') {
                return window.orientation;
            }
            return 0;
        }

        function redondear(num, dec = 1) {
            if (!Number.isFinite(num)) return '...';
            return Number(num).toFixed(dec);
        }

        function esNumero(n) {
            return typeof n === 'number' && Number.isFinite(n);
        }

        function sanitizarEvento(evento) {
            return {
                ...evento,
                id: evento.id ?? `${evento.titulo}-${evento.latitud}-${evento.longitud}`,
                titulo: String(evento.titulo ?? 'Evento'),
                lugar_nombre: String(evento.lugar_nombre ?? 'Ubicación'),
                hora_inicio: String(evento.hora_inicio ?? '00:00'),
                hora_fin: String(evento.hora_fin ?? '00:00'),
                latitud: Number(evento.latitud),
                longitud: Number(evento.longitud)
            };
        }

        function roundRectPath(ctx, x, y, w, h, r) {
            const rr = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + rr, y);
            ctx.arcTo(x + w, y, x + w, y + h, rr);
            ctx.arcTo(x + w, y + h, x, y + h, rr);
            ctx.arcTo(x, y + h, x, y, rr);
            ctx.arcTo(x, y, x + w, y, rr);
            ctx.closePath();
        }

        // ─────────────────────────────────────────────────────────────
        // PERMISOS + CÁMARA
        // ─────────────────────────────────────────────────────────────
        async function solicitarPermisosSensores() {
            // iOS 13+ exige permiso explícito dentro de un gesto de usuario.
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                const r = await DeviceOrientationEvent.requestPermission();
                if (r !== 'granted') throw new Error('Permiso de orientación denegado');
            }

            // No siempre es necesario, pero algunos iPhone también lo piden para motion.
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch (_) { /* no crítico */ }
            }
        }

        async function iniciarCamara() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('getUserMedia no está disponible. Debe ejecutarse en HTTPS.');
            }

            const video = $('video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play().catch(() => { });
                log('Cámara trasera OK');
            } catch (e) {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                await video.play().catch(() => { });
                log('Cámara fallback OK');
            }
        }

        // ─────────────────────────────────────────────────────────────
        // GPS + MUNDO LOCAL EN METROS
        // ─────────────────────────────────────────────────────────────
        function iniciarGPS() {
            if (!navigator.geolocation) {
                log('GPS no soportado');
                return;
            }

            navigator.geolocation.watchPosition(pos => {
                registrarGPS(pos.coords);
            }, err => {
                log(`GPS ERR ${err.code}: ${err.message}`);
                // Fallback menos estricto si el GPS de alta precisión falla por timeout.
                if (err.code !== 1) {
                    navigator.geolocation.getCurrentPosition(p => registrarGPS(p.coords), () => { }, {
                        enableHighAccuracy: false,
                        timeout: 60000,
                        maximumAge: 30000
                    });
                }
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 30000
            });
        }

        function registrarGPS(coords) {
            if (!esNumero(coords.latitude) || !esNumero(coords.longitude)) return;

            rawLat = coords.latitude;
            rawLng = coords.longitude;
            gpsAccuracy = coords.accuracy || 999;

            if (originLat === null) {
                originLat = rawLat;
                originLng = rawLng;
                miLat = rawLat;
                miLng = rawLng;
                log(`Origen GPS fijado: ${originLat.toFixed(7)}, ${originLng.toFixed(7)} ±${gpsAccuracy.toFixed(0)}m`);
                posicionarTodosLosIndicadores();
            }

            if (miLat === null) {
                miLat = rawLat;
                miLng = rawLng;
            } else {
                const salto = distanciaEntre(miLat, miLng, rawLat, rawLng);
                const minMove = Math.max(GPS_MIN_MOVEMENT, gpsAccuracy * 0.35);

                // Anti-jitter: no persigas cambios menores que el error GPS.
                if (salto > minMove) {
                    const alpha = clamp(salto / 40, 0.10, 0.45);
                    miLat += (rawLat - miLat) * alpha;
                    miLng += (rawLng - miLng) * alpha;
                }
            }

            const now = performance.now();
            if (now - ultimoLogGPS > 2500) {
                ultimoLogGPS = now;
                const calidad = gpsAccuracy <= GPS_MAX_ACCURACY_TO_TRUST ? 'OK' : 'baja precisión';
                log(`GPS ${calidad}: ±${gpsAccuracy.toFixed(0)}m`);
            }
        }

        function distanciaEntre(lat1, lng1, lat2, lng2) {
            const dLat = degToRad(lat2 - lat1);
            const dLng = degToRad(lng2 - lng1);
            const lat1r = degToRad(lat1);
            const lat2r = degToRad(lat2);
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1r) * Math.cos(lat2r) * Math.sin(dLng / 2) ** 2;
            return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function calcularDistancia(lat2, lng2) {
            if (miLat === null || miLng === null) return null;
            return distanciaEntre(miLat, miLng, lat2, lng2);
        }

        function calcularBearing(lat2, lng2) {
            if (miLat === null || miLng === null) return 0;
            const dLng = degToRad(lng2 - miLng);
            const lat1r = degToRad(miLat);
            const lat2r = degToRad(lat2);
            const y = Math.sin(dLng) * Math.cos(lat2r);
            const x = Math.cos(lat1r) * Math.sin(lat2r) -
                Math.sin(lat1r) * Math.cos(lat2r) * Math.cos(dLng);
            return wrap360(radToDeg(Math.atan2(y, x)));
        }

        // Conversión local: x = Este/Oeste, z = Norte/Sur invertido para Three.js.
        function latLngToWorld(lat, lng, y = 0) {
            if (originLat === null || originLng === null) {
                return new THREE.Vector3(0, y, -8);
            }
            const lat0 = degToRad(originLat);
            const x = degToRad(lng - originLng) * EARTH_RADIUS * Math.cos(lat0);
            const z = -degToRad(lat - originLat) * EARTH_RADIUS;
            return new THREE.Vector3(x, y, z);
        }

        function actualizarPosicionCamaraGPS() {
            if (!camera || miLat === null || miLng === null) return;
            const p = latLngToWorld(miLat, miLng, ALTURA_CAMARA);
            camera.position.copy(p);
        }

        // ─────────────────────────────────────────────────────────────
        // ORIENTACIÓN: QUATERNION, NO EULER SIMPLE
        // Basado en la lógica de DeviceOrientationControls de Three.js.
        // ─────────────────────────────────────────────────────────────
        async function iniciarOrientacion() {
            screenOrientationDeg = getScreenOrientationDeg();
            window.addEventListener('orientationchange', () => {
                screenOrientationDeg = getScreenOrientationDeg();
            });

            window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
            window.addEventListener('deviceorientation', onDeviceOrientation, true);

            // GyroNorm queda como fallback si el navegador no dispara eventos nativos útiles.
            setTimeout(() => {
                if (!orientationAvailable) iniciarGyroNormFallback();
            }, 1400);

            log('Listeners de orientación activos');
        }

        function onDeviceOrientation(e) {
            if (!esNumero(e.alpha) || !esNumero(e.beta) || !esNumero(e.gamma)) return;

            const now = performance.now();
            const hasIOSCompass = esNumero(e.webkitCompassHeading);
            const isAbsolute = e.type === 'deviceorientationabsolute' || e.absolute === true || hasIOSCompass;

            // Si ya llega orientación absoluta, ignora eventos relativos recientes.
            if (!isAbsolute && now - lastAbsoluteOrientationMs < 900) return;
            if (isAbsolute) lastAbsoluteOrientationMs = now;

            deviceAlpha = e.alpha;
            deviceBeta = e.beta;
            deviceGamma = e.gamma;
            orientationAvailable = true;
            orientationSource = isAbsolute ? 'deviceorientation absolute' : 'deviceorientation relative';

            if (hasIOSCompass) {
                compassHeading = wrap360(e.webkitCompassHeading);
                orientationSource = 'iOS webkitCompassHeading';
            }
        }

        function iniciarGyroNormFallback() {
            if (typeof GyroNorm === 'undefined' || gnInstance) return;

            try {
                gnInstance = new GyroNorm();
                gnInstance.init({
                    frequency: 50,
                    gravityNormalized: true,
                    orientationBase: GyroNorm.WORLD,
                    decimalCount: 2,
                    logger: null,
                    screenAdjusted: false
                }).then(() => {
                    gnInstance.start(data => {
                        if (!data || !data.do) return;
                        if (!esNumero(data.do.alpha) || !esNumero(data.do.beta) || !esNumero(data.do.gamma)) return;

                        // No sobreescribas una fuente absoluta nativa reciente.
                        if (performance.now() - lastAbsoluteOrientationMs < 900) return;

                        deviceAlpha = data.do.alpha;
                        deviceBeta = data.do.beta;
                        deviceGamma = data.do.gamma;
                        orientationAvailable = true;
                        orientationSource = 'GyroNorm fallback';
                    });
                    log('GyroNorm fallback activo');
                }).catch(err => {
                    log('GyroNorm no disponible: ' + err.message);
                });
            } catch (err) {
                log('GyroNorm fallback error: ' + err.message);
            }
        }

        function actualizarOrientacionCamara() {
            if (!camera || !orientationAvailable) return;

            const alpha = degToRad(deviceAlpha || 0) + alphaOffsetRad;
            const beta = degToRad(deviceBeta || 0);
            const gamma = degToRad(deviceGamma || 0);
            const orient = degToRad(screenOrientationDeg || 0);

            // Conversión correcta deviceorientation → quaternion cámara.
            orientationEuler.set(beta, alpha, -gamma, 'YXZ');
            qTarget.setFromEuler(orientationEuler);
            qTarget.multiply(q1);
            qTarget.multiply(q0.setFromAxisAngle(zee, -orient));

            // Slerp = giros suaves sin el lag fuerte del EMA sobre grados.
            camera.quaternion.slerp(qTarget, ORIENTATION_SLERP);

            lastHeadingDeg = headingDesdeQuaternion(camera.quaternion);
            corregirNorteLentoConBrujula();
        }

        function headingDesdeQuaternion(q) {
            tmpVec3.set(0, 0, -1).applyQuaternion(q);
            return wrap360(radToDeg(Math.atan2(tmpVec3.x, -tmpVec3.z)));
        }

        function corregirNorteLentoConBrujula() {
            if (!esNumero(compassHeading)) return;

            const now = performance.now();
            if (now - lastCompassCorrectionMs < 120) return;
            lastCompassCorrectionMs = now;

            const error = diffAngDeg(compassHeading, lastHeadingDeg);
            if (Math.abs(error) > MAX_COMPASS_JUMP) return;

            alphaOffsetRad += degToRad(error * COMPASS_CORRECTION_GAIN);
        }

        function guardarCalibracion() {
            localStorage.setItem('unieventos_alphaOffsetRad', String(alphaOffsetRad));
        }

        function resetearCalibracion() {
            alphaOffsetRad = 0;
            localStorage.removeItem('unieventos_alphaOffsetRad');
            log('Calibración reseteada');
        }

        function calibrarApuntandoAlNorte() {
            if (!camera || !orientationAvailable) {
                log('No hay orientación para calibrar');
                return;
            }
            const actual = headingDesdeQuaternion(camera.quaternion);
            const error = diffAngDeg(0, actual);
            alphaOffsetRad += degToRad(error);
            guardarCalibracion();
            log(`Calibrado al norte: corrección ${error.toFixed(1)}°`);
        }

        function calibrarConEventoMasCercano() {
            if (!camera || !orientationAvailable || miLat === null || eventosData.length === 0) {
                log('Falta orientación/GPS/eventos para calibrar');
                return;
            }

            let mejor = null;
            for (const evento of eventosData) {
                const dist = calcularDistancia(evento.latitud, evento.longitud);
                if (dist === null || dist < DIST_LLEGADA_BASE || dist > DIST_MAXIMA) continue;
                if (!mejor || dist < mejor.dist) mejor = { evento, dist };
            }

            if (!mejor) {
                log('No hay evento cercano válido para calibrar');
                return;
            }

            const bearingEvento = calcularBearing(mejor.evento.latitud, mejor.evento.longitud);
            const headingActual = headingDesdeQuaternion(camera.quaternion);
            const error = diffAngDeg(bearingEvento, headingActual);

            alphaOffsetRad += degToRad(error);
            guardarCalibracion();

            log(`Calibrado con "${mejor.evento.titulo.slice(0, 20)}": evento ${bearingEvento.toFixed(1)}°, cámara ${headingActual.toFixed(1)}°, corr ${error.toFixed(1)}°`);
        }

        // ─────────────────────────────────────────────────────────────
        // THREE.JS + INDICADORES
        // ─────────────────────────────────────────────────────────────
        function iniciarThree() {
            const canvas = $('canvas');

            renderer = new THREE.WebGLRenderer({
                canvas,
                alpha: true,
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);

            scene = new THREE.Scene();

            // FOV aproximado de cámara móvil. Si quieres más coincidencia visual,
            // ajusta entre 60 y 75 según el lente del dispositivo.
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 1200);
            camera.position.set(0, ALTURA_CAMARA, 0);
            scene.add(camera);

            window.addEventListener('resize', onResize);
            onResize();

            log('Three.js OK');
        }

        function onResize() {
            if (!renderer || !camera) return;
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        function dibujarCard(ctx, evento, dist) {
            const w = 512, h = 280;
            ctx.clearRect(0, 0, w, h);

            const cerca = dist !== null && dist < 60;
            const titulo = evento.titulo.length > 28 ? evento.titulo.slice(0, 25) + '...' : evento.titulo;
            const lugar = evento.lugar_nombre.length > 32 ? evento.lugar_nombre.slice(0, 29) + '...' : evento.lugar_nombre;
            const hi = evento.hora_inicio.slice(0, 5);
            const hf = evento.hora_fin.slice(0, 5);

            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.45)';
            ctx.shadowBlur = 18;
            roundRectPath(ctx, 6, 6, w - 12, h - 12, 24);
            ctx.fillStyle = 'rgba(15,15,46,0.94)';
            ctx.fill();
            ctx.restore();

            roundRectPath(ctx, 6, 6, w - 12, h - 12, 24);
            ctx.strokeStyle = cerca ? '#00ff88' : '#6c63ff';
            ctx.lineWidth = 5;
            ctx.stroke();

            roundRectPath(ctx, 6, 6, w - 12, 20, 10);
            ctx.fillStyle = cerca ? '#00ff88' : '#6c63ff';
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 34px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(titulo, w / 2, 68);

            ctx.fillStyle = '#a8a6ff';
            ctx.font = '23px system-ui, sans-serif';
            ctx.fillText(`📍 ${lugar}`, w / 2, 113);

            ctx.fillStyle = '#82ffd0';
            ctx.font = '21px system-ui, sans-serif';
            ctx.fillText(`🕐 ${hi} - ${hf}`, w / 2, 154);

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 30px system-ui, sans-serif';
            const txt = dist === null ? 'Buscando GPS...'
                : dist < 1000 ? `${Math.round(dist)} m`
                    : `${(dist / 1000).toFixed(1)} km`;
            ctx.fillText(txt, w / 2, 208);

            ctx.fillStyle = 'rgba(255,255,255,0.70)';
            ctx.font = '16px system-ui, sans-serif';
            ctx.fillText('Mantén el celular calibrado para mejor precisión', w / 2, 244);
        }

        function crearIndicadores() {
            // Limpia si se recarga la API.
            indicadores.forEach(mesh => {
                scene.remove(mesh);
                if (mesh.geometry) mesh.geometry.dispose();
                if (mesh.material && mesh.material.map) mesh.material.map.dispose();
                if (mesh.material) mesh.material.dispose();
            });
            indicadores = [];

            eventosData.forEach(evento => {
                if (!esNumero(evento.latitud) || !esNumero(evento.longitud)) return;

                const canvasTex = document.createElement('canvas');
                canvasTex.width = 512;
                canvasTex.height = 280;
                const ctx = canvasTex.getContext('2d');
                dibujarCard(ctx, evento, null);

                const texture = new THREE.CanvasTexture(canvasTex);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;

                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(3.2, 1.75),
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                        depthTest: true
                    })
                );

                mesh.userData = {
                    evento,
                    texture,
                    canvasTex,
                    ctx,
                    gpsPositioned: false,
                    lastTextureUpdate: 0
                };
                mesh.visible = false;
                mesh.renderOrder = 10;
                scene.add(mesh);
                indicadores.push(mesh);
            });

            posicionarTodosLosIndicadores();
            log(`${indicadores.length} indicadores creados`);
        }

        function posicionarTodosLosIndicadores() {
            if (originLat === null || !scene) return;

            indicadores.forEach(mesh => {
                const evento = mesh.userData.evento;
                const pos = latLngToWorld(evento.latitud, evento.longitud, ALTURA_INDICADOR);
                mesh.position.copy(pos);
                mesh.userData.gpsPositioned = true;
            });
        }

        function actualizarIndicadores() {
            if (!camera) return;

            indicadores.forEach(mesh => {
                const { evento, texture, ctx } = mesh.userData;
                const dist = calcularDistancia(evento.latitud, evento.longitud);

                if (!mesh.userData.gpsPositioned && originLat !== null) {
                    const pos = latLngToWorld(evento.latitud, evento.longitud, ALTURA_INDICADOR);
                    mesh.position.copy(pos);
                    mesh.userData.gpsPositioned = true;
                }

                if (dist === null || !mesh.userData.gpsPositioned) {
                    mesh.visible = false;
                    return;
                }

                if (dist > DIST_MAXIMA) {
                    mesh.visible = false;
                    return;
                }

                const umbralLlegada = DIST_LLEGADA_BASE;

                if (dist < umbralLlegada) {
                    mesh.visible = false;
                    mostrarLlegada(evento);
                    return;
                }

                mesh.visible = true;

                // Billboard real: siempre mira a la cámara, pero su posición NO depende del heading.
                mesh.lookAt(camera.position);

                // Escala UX: mantiene legibles los letreros lejanos sin moverlos del mundo.
                const escala = clamp(dist / 22, 1.0, 8.5);
                mesh.scale.setScalar(escala);

                const now = performance.now();
                if (now - mesh.userData.lastTextureUpdate > 750) {
                    mesh.userData.lastTextureUpdate = now;
                    dibujarCard(ctx, evento, dist);
                    texture.needsUpdate = true;
                }
            });
        }

        function mostrarLlegada(evento) {
            if (llegadaMostrada[evento.id]) return;
            llegadaMostrada[evento.id] = true;

            const div = $('llegada');
            div.innerHTML = `✅ ¡Llegaste!<br><span style="font-size:18px">${evento.titulo}</span>`;
            div.style.display = 'block';

            setTimeout(() => {
                div.style.display = 'none';
                delete llegadaMostrada[evento.id];
            }, 5000);
        }

        // ─────────────────────────────────────────────────────────────
        // API
        // ─────────────────────────────────────────────────────────────
        async function cargarEventos() {
            log('Cargando eventos...');
            const res = await fetch(API_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error(`API ${res.status}: ${res.statusText}`);

            const data = await res.json();
            if (!Array.isArray(data)) throw new Error('La API no devolvió un array');

            eventosData = data.map(sanitizarEvento).filter(e => esNumero(e.latitud) && esNumero(e.longitud));
            log(`${eventosData.length} eventos cargados`);

            if (eventosData.length === 0) {
                setStatus('Sin eventos disponibles');
            }
        }

        // ─────────────────────────────────────────────────────────────
        // LOOP
        // ─────────────────────────────────────────────────────────────
        function animar() {
            requestAnimationFrame(animar);
            frameCount++;

            actualizarPosicionCamaraGPS();
            actualizarOrientacionCamara();
            actualizarIndicadores();

            if (frameCount % 60 === 0) {
                const acc = gpsAccuracy < 999 ? `±${gpsAccuracy.toFixed(0)}m` : 'sin GPS';
                setStatus(`GPS ${acc} · heading ${lastHeadingDeg.toFixed(0)}° · ${orientationSource} · ${indicadores.length} eventos`);
            }

            renderer.render(scene, camera);
        }

        // ─────────────────────────────────────────────────────────────
        // INIT
        // ─────────────────────────────────────────────────────────────
        async function iniciar() {
            const btn = $('btn-iniciar');
            btn.disabled = true;
            btn.textContent = 'Iniciando...';
            setStatus('Solicitando permisos...');
            log('Iniciando AR...');

            try {
                await solicitarPermisosSensores();
                await iniciarCamara();
                iniciarThree();
                iniciarGPS();
                await iniciarOrientacion();
                await cargarEventos();
                crearIndicadores();

                btn.style.display = 'none';
                $('acciones').style.display = 'flex';
                setStatus('Listo. Si el norte queda corrido, calibra apuntando a un evento real.');

                if (!animacionIniciada) {
                    animacionIniciada = true;
                    animar();
                }

                log('Listo ✓');
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Reintentar';
                setStatus('Error: ' + err.message);
                log('ERROR INIT: ' + err.message);
            }
        }

        $('btn-iniciar').addEventListener('click', iniciar);
        $('btn-calibrar-evento').addEventListener('click', calibrarConEventoMasCercano);
        $('btn-calibrar-norte').addEventListener('click', calibrarApuntandoAlNorte);
        $('btn-reset').addEventListener('click', resetearCalibracion);
    </script>
</body>
