<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>UniEventos AR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gyronorm@2.0.6/dist/gyronorm.complete.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            overscroll-behavior: none;
            touch-action: none;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
            z-index: 10;
            color: white;
            font-family: system-ui, sans-serif;
            pointer-events: none;
        }

        #titulo {
            font-weight: 800;
            font-size: 18px;
        }

        #status {
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.9;
        }

        #btn-iniciar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 20px 34px;
            font-size: 18px;
            font-weight: 800;
            z-index: 40;
            cursor: pointer;
            font-family: system-ui, sans-serif;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: system-ui, sans-serif;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            z-index: 35;
            display: none;
        }

        #loading-bar {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 10px auto 0;
        }

        #loading-fill {
            height: 100%;
            width: 0%;
            background: #6c63ff;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        #llegada {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 24px 36px;
            color: #00ff88;
            font-family: system-ui, sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            z-index: 35;
            display: none;
            animation: pulsar 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulsar {
            from {
                box-shadow: 0 0 10px #00ff88;
            }

            to {
                box-shadow: 0 0 30px #00ff88;
            }
        }

        #debug {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.86);
            color: #78ff78;
            font-family: monospace;
            font-size: 10px;
            padding: 6px;
            z-index: 99;
            max-height: 22vh;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="titulo">🎯 UniEventos AR</div>
        <div id="status">Toca para iniciar</div>
    </div>
    <button id="btn-iniciar">🎯 Iniciar UniEventos AR</button>
    <div id="loading">
        📡 Obteniendo ubicación...<br>
        <div id="loading-bar">
            <div id="loading-fill"></div>
        </div>
    </div>
    <div id="llegada"></div>
    <div id="debug"></div>

    <script>
        'use strict';

        const API_URL = 'https://unieventos-s25a.onrender.com/eventos/ar';
        const DIST_MAXIMA = 500;
        const DIST_LLEGADA = 10;
        const EARTH_RADIUS = 6378137;
        const ORIENTATION_SLERP = 0.15;
        const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const GPS_BUFFER_SIZE = 5;

        localStorage.removeItem('unieventos_alphaOffsetRad');

        let renderer, scene, camera;
        let eventosData = [], indicadores = [];
        let frameCount = 0, animacionIniciada = false;

        let miLat = null, miLng = null, gpsAccuracy = 999;
        let originLat = null, originLng = null;
        let ultimoLogGPS = 0;
        let gpsBuffer = [];

        let orientationAvailable = false;
        let lastAbsoluteOrientationMs = 0;
        let orientationSource = 'sin orientación';
        let deviceAlpha = null, deviceBeta = null, deviceGamma = null;
        let compassHeading = null;
        let screenOrientationDeg = getScreenOrientationDeg();
        let gnInstance = null;
        let lastHeadingDeg = 0;

        let llegadaTimer = null;
        let llegadaEventoId = null;

        // iOS: brújula y pitch filtrados por separado.
        // Esto evita que al inclinar arriba/abajo se contamine el yaw horizontal.
        let rawCompassHeading = null;
        let smoothCompassHeading = null;
        let iosYawDeg = null;
        let iosPitchDeg = null;
        let iosLastRawHeadingDeg = null;
        let iosLastHeadingSampleMs = 0;

        const IOS_YAW_ALPHA_MIN = 0.10;      // quieto: más estable
        const IOS_YAW_ALPHA_MAX = 0.58;      // giro rápido: menos lag
        const IOS_YAW_FULL_SPEED_DEG = 55;   // a partir de aquí responde rápido
        const IOS_PITCH_ALPHA = 0.24;
        const IOS_CAMERA_SLERP = 0.68;
        const IOS_PITCH_CENTER_DEG = 90;     // iPhone en vertical mirando al horizonte ≈ beta 90
        const IOS_MAX_PITCH_DEG = 72;

        const zee = new THREE.Vector3(0, 0, 1);
        const orientationEuler = new THREE.Euler();
        const q0 = new THREE.Quaternion();
        const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
        const qTarget = new THREE.Quaternion();
        const tmpVec3 = new THREE.Vector3();

        // iOS: quaternions separados para NO mezclar pitch con yaw.
        // El yaw viene de la brújula y el pitch viene de beta.
        // No usamos gamma/roll porque en iOS suele contaminar el eje horizontal.
        const iosAxisY = new THREE.Vector3(0, 1, 0);
        const iosAxisX = new THREE.Vector3(1, 0, 0);
        const iosQYaw = new THREE.Quaternion();
        const iosQPitch = new THREE.Quaternion();

        function $(id) { return document.getElementById(id); }
        function log(msg) {
            const d = $('debug');
            const lines = d.innerHTML.split('<br>');
            if (lines.length > 90) d.innerHTML = lines.slice(-80).join('<br>');
            d.innerHTML += msg + '<br>';
            d.scrollTop = d.scrollHeight;
        }
        function setStatus(msg) { $('status').textContent = msg; }
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function wrap360(a) { return ((a % 360) + 360) % 360; }
        function degToRad(d) { return d * Math.PI / 180; }
        function radToDeg(r) { return r * 180 / Math.PI; }
        function esNumero(n) { return typeof n === 'number' && Number.isFinite(n); }

        function getScreenOrientationDeg() {
            if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
            if (typeof window.orientation === 'number') return window.orientation;
            return 0;
        }

        function sanitizarEvento(e) {
            return {
                ...e,
                id: e.id ?? `${e.titulo}-${e.latitud}-${e.longitud}`,
                titulo: String(e.titulo ?? 'Evento'),
                lugar_nombre: String(e.lugar_nombre ?? 'Ubicación'),
                hora_inicio: String(e.hora_inicio ?? '00:00'),
                hora_fin: String(e.hora_fin ?? '00:00'),
                latitud: Number(e.latitud),
                longitud: Number(e.longitud)
            };
        }

        function roundRectPath(ctx, x, y, w, h, r) {
            const rr = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + rr, y); ctx.arcTo(x + w, y, x + w, y + h, rr);
            ctx.arcTo(x + w, y + h, x, y + h, rr); ctx.arcTo(x, y + h, x, y, rr);
            ctx.arcTo(x, y, x + w, y, rr); ctx.closePath();
        }

        async function solicitarPermisosSensores() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                const r = await DeviceOrientationEvent.requestPermission();
                if (r !== 'granted') throw new Error('Permiso de orientación denegado');
            }
            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch (_) { }
            }
        }

        async function iniciarCamara() {
            if (!navigator.mediaDevices?.getUserMedia)
                throw new Error('getUserMedia no disponible. Usa HTTPS.');
            const video = $('video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play().catch(() => { });
                log('Cámara OK');
            } catch (e) {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, audio: false
                });
                video.srcObject = stream;
                await video.play().catch(() => { });
                log('Cámara fallback OK');
            }
        }

        function iniciarGPS() {
            if (!navigator.geolocation) { log('GPS no soportado'); return; }
            navigator.geolocation.watchPosition(pos => {
                registrarGPS(pos.coords);
            }, err => {
                log(`GPS ERR ${err.code}: ${err.message}`);
                if (err.code !== 1) {
                    navigator.geolocation.getCurrentPosition(
                        p => registrarGPS(p.coords), () => { },
                        { enableHighAccuracy: false, timeout: 60000, maximumAge: 30000 }
                    );
                }
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
        }

        function registrarGPS(coords) {
            if (!esNumero(coords.latitude) || !esNumero(coords.longitude)) return;
            gpsAccuracy = coords.accuracy || 999;

            if (originLat === null) {
                gpsBuffer.push({ lat: coords.latitude, lng: coords.longitude, acc: gpsAccuracy });

                const loading = $('loading');
                loading.style.display = 'block';
                const pct = (gpsBuffer.length / GPS_BUFFER_SIZE) * 100;
                $('loading-fill').style.width = pct + '%';
                log(`GPS buffer: ${gpsBuffer.length}/${GPS_BUFFER_SIZE} ±${gpsAccuracy.toFixed(0)}m`);

                if (gpsBuffer.length < GPS_BUFFER_SIZE) return;

                const avgLat = gpsBuffer.reduce((s, p) => s + p.lat, 0) / gpsBuffer.length;
                const avgLng = gpsBuffer.reduce((s, p) => s + p.lng, 0) / gpsBuffer.length;
                const avgAcc = gpsBuffer.reduce((s, p) => s + p.acc, 0) / gpsBuffer.length;

                originLat = avgLat;
                originLng = avgLng;
                miLat = avgLat;
                miLng = avgLng;
                gpsAccuracy = avgAcc;
                gpsBuffer = [];

                loading.style.display = 'none';
                log(`Origen GPS fijado: ±${gpsAccuracy.toFixed(0)}m`);
                posicionarTodosLosIndicadores();
                return;
            }

            const salto = distanciaEntre(miLat, miLng, coords.latitude, coords.longitude);
            const minMove = Math.max(2.5, gpsAccuracy * 0.35);
            if (salto > minMove) {
                const alpha = clamp(salto / 40, 0.10, 0.45);
                miLat += (coords.latitude - miLat) * alpha;
                miLng += (coords.longitude - miLng) * alpha;
                posicionarTodosLosIndicadores();
            }

            const now = performance.now();
            if (now - ultimoLogGPS > 2500) {
                ultimoLogGPS = now;
                log(`GPS: ±${gpsAccuracy.toFixed(0)}m`);
            }
        }

        function distanciaEntre(lat1, lng1, lat2, lng2) {
            const dLat = degToRad(lat2 - lat1), dLng = degToRad(lng2 - lng1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(degToRad(lat1)) * Math.cos(degToRad(lat2)) * Math.sin(dLng / 2) ** 2;
            return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function calcularDistancia(lat2, lng2) {
            if (miLat === null) return null;
            return distanciaEntre(miLat, miLng, lat2, lng2);
        }

        function calcularBearing(lat2, lng2) {
            if (miLat === null) return 0;
            const dLng = degToRad(lng2 - miLng);
            const lat1r = degToRad(miLat), lat2r = degToRad(lat2);
            const y = Math.sin(dLng) * Math.cos(lat2r);
            const x = Math.cos(lat1r) * Math.sin(lat2r) - Math.sin(lat1r) * Math.cos(lat2r) * Math.cos(dLng);
            return wrap360(radToDeg(Math.atan2(y, x)));
        }

        function latLngToWorld(lat, lng, y = 0) {
            if (originLat === null) return new THREE.Vector3(0, y, -10);
            const lat0 = degToRad(originLat);
            const x = degToRad(lng - originLng) * EARTH_RADIUS * Math.cos(lat0);
            const z = -degToRad(lat - originLat) * EARTH_RADIUS;
            return new THREE.Vector3(x, y, z);
        }

        async function iniciarOrientacion() {
            screenOrientationDeg = getScreenOrientationDeg();
            window.addEventListener('orientationchange', () => {
                screenOrientationDeg = getScreenOrientationDeg();
            });
            window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            setTimeout(() => {
                if (!orientationAvailable) iniciarGyroNormFallback();
            }, 1400);
            log('Orientación activa');
        }

        function onDeviceOrientation(e) {
            if (!esNumero(e.alpha) || !esNumero(e.beta) || !esNumero(e.gamma)) return;
            const now = performance.now();
            const hasIOSCompass = esNumero(e.webkitCompassHeading);
            const isAbsolute = e.type === 'deviceorientationabsolute' || e.absolute === true || hasIOSCompass;
            if (!isAbsolute && now - lastAbsoluteOrientationMs < 900) return;
            if (isAbsolute) lastAbsoluteOrientationMs = now;
            deviceAlpha = e.alpha;
            deviceBeta = e.beta;
            deviceGamma = e.gamma;
            orientationAvailable = true;
            orientationSource = isAbsolute ? 'absolute' : 'relative';
            if (hasIOSCompass) {
                // En iOS NO filtramos aquí con un EMA fijo: produce lag.
                // Guardamos la brújula cruda y el filtro adaptativo se aplica en actualizarOrientacionCamaraIOS().
                rawCompassHeading = wrap360(e.webkitCompassHeading);
                compassHeading = rawCompassHeading;
                iosLastHeadingSampleMs = now;
                orientationSource = 'iOS compass';
            }
        }

        function iniciarGyroNormFallback() {
            if (esIOS) { log('iOS — sin GyroNorm'); return; }
            if (typeof GyroNorm === 'undefined' || gnInstance) return;
            try {
                gnInstance = new GyroNorm();
                gnInstance.init({
                    frequency: 50, gravityNormalized: true,
                    orientationBase: GyroNorm.WORLD, decimalCount: 2,
                    logger: null, screenAdjusted: false
                }).then(() => {
                    gnInstance.start(data => {
                        if (!data?.do) return;
                        if (!esNumero(data.do.alpha) || !esNumero(data.do.beta) || !esNumero(data.do.gamma)) return;
                        if (performance.now() - lastAbsoluteOrientationMs < 900) return;
                        deviceAlpha = data.do.alpha;
                        deviceBeta = data.do.beta;
                        deviceGamma = data.do.gamma;
                        orientationAvailable = true;
                        orientationSource = 'GyroNorm';
                    });
                    log('GyroNorm OK');
                }).catch(err => log('GyroNorm err: ' + err.message));
            } catch (err) { log('GyroNorm exc: ' + err.message); }
        }

        function diffAngDeg(a, b) {
            return ((a - b + 540) % 360) - 180;
        }

        function suavizarAnguloDeg(actual, objetivo, alpha) {
            if (!esNumero(actual)) return wrap360(objetivo);
            const d = diffAngDeg(objetivo, actual);
            return wrap360(actual + d * alpha);
        }

        function calcularAlphaYawIOS(diffAbs) {
            // Filtro adaptativo: quieto filtra fuerte, girando rápido responde más rápido.
            const t = clamp(diffAbs / IOS_YAW_FULL_SPEED_DEG, 0, 1);
            return IOS_YAW_ALPHA_MIN + (IOS_YAW_ALPHA_MAX - IOS_YAW_ALPHA_MIN) * t;
        }

        function calcularPitchIOS() {
            if (!esNumero(deviceBeta)) return iosPitchDeg ?? 0;

            // En portrait, beta≈90 es horizonte. Convertimos a pitch de cámara Three.js.
            // No usamos gamma/roll para iOS: gamma mete desplazamiento horizontal al inclinar.
            let pitch = -(deviceBeta - IOS_PITCH_CENTER_DEG);

            // Si el usuario gira físicamente el teléfono a landscape, degradamos a pitch cero
            // para no mezclar ejes y producir saltos horizontales. La app está pensada en portrait.
            const orient = ((screenOrientationDeg % 360) + 360) % 360;
            if (orient === 90 || orient === 270) pitch = 0;

            return clamp(pitch, -IOS_MAX_PITCH_DEG, IOS_MAX_PITCH_DEG);
        }

        function actualizarOrientacionCamaraIOS() {
            if (!esNumero(rawCompassHeading)) return;

            const rawYaw = wrap360(rawCompassHeading);

            if (iosYawDeg === null) {
                iosYawDeg = rawYaw;
                smoothCompassHeading = rawYaw;
                iosLastRawHeadingDeg = rawYaw;
            } else {
                const diffRaw = Math.abs(diffAngDeg(rawYaw, iosLastRawHeadingDeg ?? rawYaw));
                iosLastRawHeadingDeg = rawYaw;
                const diffToSmooth = Math.abs(diffAngDeg(rawYaw, iosYawDeg));
                const alphaYaw = diffRaw > 80 ? IOS_YAW_ALPHA_MIN : calcularAlphaYawIOS(diffToSmooth);
                iosYawDeg = suavizarAnguloDeg(iosYawDeg, rawYaw, alphaYaw);
                smoothCompassHeading = iosYawDeg;
            }

            // Pitch real de iOS: si lo dejamos fijo en 0, el indicador queda pegado a la pantalla
            // cuando el usuario mueve el celular arriba/abajo. Lo filtramos separado del yaw.
            const targetPitchDeg = calcularPitchIOS();
            if (iosPitchDeg === null) iosPitchDeg = targetPitchDeg;
            else iosPitchDeg += (targetPitchDeg - iosPitchDeg) * IOS_PITCH_ALPHA;

            // Composición desacoplada:
            // - yaw: mundo horizontal, desde brújula iOS
            // - pitch: inclinación vertical, desde beta
            // - roll/gamma: ignorado en iOS para evitar deriva horizontal falsa
            iosQYaw.setFromAxisAngle(iosAxisY, degToRad(-iosYawDeg));
            iosQPitch.setFromAxisAngle(iosAxisX, degToRad(iosPitchDeg));
            qTarget.copy(iosQYaw).multiply(iosQPitch);

            camera.quaternion.slerp(qTarget, IOS_CAMERA_SLERP);
            lastHeadingDeg = iosYawDeg;
        }

        function actualizarOrientacionCamara() {
            if (!camera || !orientationAvailable) return;

            if (esIOS) {
                actualizarOrientacionCamaraIOS();
            } else {
                // Android — no se toca
                const alpha = degToRad(deviceAlpha || 0);
                const beta = degToRad(deviceBeta || 0);
                const gamma = degToRad(deviceGamma || 0);
                const orient = degToRad(screenOrientationDeg || 0);

                orientationEuler.set(beta, alpha, -gamma, 'YXZ');
                qTarget.setFromEuler(orientationEuler);
                qTarget.multiply(q1);
                qTarget.multiply(q0.setFromAxisAngle(zee, -orient));
                camera.quaternion.slerp(qTarget, ORIENTATION_SLERP);
                lastHeadingDeg = headingDesdeQuaternion(camera.quaternion);
            }
        }
        function headingDesdeQuaternion(q) {
            tmpVec3.set(0, 0, -1).applyQuaternion(q);
            return wrap360(radToDeg(Math.atan2(tmpVec3.x, -tmpVec3.z)));
        }

        function iniciarThree() {
            const canvas = $('canvas');
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 1200);
            camera.position.set(0, 0, 0);
            scene.add(camera);
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });
            log('Three.js OK');
        }

        function dibujarCard(ctx, evento, dist) {
            const w = 512, h = 280;
            ctx.clearRect(0, 0, w, h);
            const cerca = dist !== null && dist < 60;
            const titulo = evento.titulo.length > 28 ? evento.titulo.slice(0, 25) + '...' : evento.titulo;
            const lugar = evento.lugar_nombre.length > 32 ? evento.lugar_nombre.slice(0, 29) + '...' : evento.lugar_nombre;

            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.45)';
            ctx.shadowBlur = 18;
            roundRectPath(ctx, 6, 6, w - 12, h - 12, 24);
            ctx.fillStyle = 'rgba(15,15,46,0.94)';
            ctx.fill();
            ctx.restore();

            roundRectPath(ctx, 6, 6, w - 12, h - 12, 24);
            ctx.strokeStyle = cerca ? '#00ff88' : '#6c63ff';
            ctx.lineWidth = 5;
            ctx.stroke();

            roundRectPath(ctx, 6, 6, w - 12, 20, 10);
            ctx.fillStyle = cerca ? '#00ff88' : '#6c63ff';
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 34px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(titulo, w / 2, 68);

            ctx.fillStyle = '#a8a6ff';
            ctx.font = '23px system-ui, sans-serif';
            ctx.fillText(`📍 ${lugar}`, w / 2, 113);

            ctx.fillStyle = '#82ffd0';
            ctx.font = '21px system-ui, sans-serif';
            ctx.fillText(`🕐 ${evento.hora_inicio.slice(0, 5)} - ${evento.hora_fin.slice(0, 5)}`, w / 2, 154);

            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 30px system-ui, sans-serif';
            const txt = dist === null ? 'Buscando GPS...'
                : dist < 1000 ? `${Math.round(dist)} m`
                    : `${(dist / 1000).toFixed(1)} km`;
            ctx.fillText(txt, w / 2, 208);
        }

        function crearIndicadores() {
            indicadores.forEach(mesh => {
                scene.remove(mesh);
                mesh.geometry?.dispose();
                mesh.material?.map?.dispose();
                mesh.material?.dispose();
            });
            indicadores = [];

            eventosData.forEach(evento => {
                if (!esNumero(evento.latitud) || !esNumero(evento.longitud)) return;
                const canvasTex = document.createElement('canvas');
                canvasTex.width = 512; canvasTex.height = 280;
                const ctx = canvasTex.getContext('2d');
                dibujarCard(ctx, evento, null);

                const texture = new THREE.CanvasTexture(canvasTex);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;

                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(3.2, 1.75),
                    new THREE.MeshBasicMaterial({
                        map: texture, transparent: true,
                        side: THREE.DoubleSide, depthWrite: false, depthTest: true
                    })
                );
                mesh.userData = { evento, texture, canvasTex, ctx, gpsPositioned: false, lastDist: null };
                mesh.visible = false;
                mesh.renderOrder = 10;
                scene.add(mesh);
                indicadores.push(mesh);
            });

            posicionarTodosLosIndicadores();
            log(`${indicadores.length} indicadores creados`);
        }

        function posicionarTodosLosIndicadores() {
            if (originLat === null || !scene) return;
            indicadores.forEach(mesh => {
                const pos = latLngToWorld(mesh.userData.evento.latitud, mesh.userData.evento.longitud, 1.70);
                mesh.position.copy(pos);
                mesh.userData.gpsPositioned = true;
                log(`Indicador: x=${pos.x.toFixed(1)} z=${pos.z.toFixed(1)}`);
            });
        }

        function actualizarIndicadores() {
            if (!camera) return;
            if (esIOS) actualizarIndicadoresIOS();
            else actualizarIndicadoresAndroid();
        }

        function actualizarIndicadoresAndroid() {
            if (miLat !== null) {
                const p = latLngToWorld(miLat, miLng, 1.60);
                camera.position.copy(p);
            }

            indicadores.forEach(mesh => {
                const { evento, texture, ctx } = mesh.userData;
                const dist = calcularDistancia(evento.latitud, evento.longitud);

                if (!mesh.userData.gpsPositioned || dist === null || dist > DIST_MAXIMA) {
                    mesh.visible = false; return;
                }

                if (dist < DIST_LLEGADA) {
                    mesh.visible = false;
                    mostrarLlegada(evento);
                    return;
                } else if (llegadaEventoId === evento.id) {
                    ocultarLlegada();
                }

                mesh.visible = true;
                mesh.lookAt(camera.position);

                const t = clamp((dist - DIST_LLEGADA) / (DIST_MAXIMA - DIST_LLEGADA), 0, 1);
                mesh.scale.setScalar(1.5 - t * 1.2);

                const distCambio = mesh.userData.lastDist === null ? 999 : Math.abs(dist - mesh.userData.lastDist);
                if (distCambio > 2) {
                    mesh.userData.lastDist = dist;
                    dibujarCard(ctx, evento, dist);
                    texture.needsUpdate = true;
                }
            });
        }

        function actualizarIndicadoresIOS() {
            if (miLat === null) return;

            if (miLat !== null) {
                const p = latLngToWorld(miLat, miLng, 1.60);
                camera.position.copy(p);
            }

            indicadores.forEach(mesh => {
                const { evento, texture, ctx } = mesh.userData;
                const dist = calcularDistancia(evento.latitud, evento.longitud);

                if (!mesh.userData.gpsPositioned || dist === null || dist > DIST_MAXIMA) {
                    mesh.visible = false; return;
                }

                if (dist < DIST_LLEGADA) {
                    mesh.visible = false;
                    mostrarLlegada(evento);
                    return;
                } else if (llegadaEventoId === evento.id) {
                    ocultarLlegada();
                }

                mesh.visible = true;
                const dx = camera.position.x - mesh.position.x;
                const dz = camera.position.z - mesh.position.z;
                mesh.rotation.set(0, Math.atan2(dx, dz), 0);

                const t = clamp((dist - DIST_LLEGADA) / (DIST_MAXIMA - DIST_LLEGADA), 0, 1);
                mesh.scale.setScalar(1.5 - t * 1.2);

                const distCambio = mesh.userData.lastDist === null ? 999 : Math.abs(dist - mesh.userData.lastDist);
                if (distCambio > 2) {
                    mesh.userData.lastDist = dist;
                    dibujarCard(ctx, evento, dist);
                    texture.needsUpdate = true;
                }
            });
        }

        function mostrarLlegada(evento) {
            if (llegadaEventoId === evento.id) return;
            llegadaEventoId = evento.id;
            if (llegadaTimer) clearTimeout(llegadaTimer);
            const div = $('llegada');
            div.innerHTML = `✅ ¡Llegaste!<br><span style="font-size:18px">${evento.titulo}</span>`;
            div.style.display = 'block';
            llegadaTimer = setTimeout(() => ocultarLlegada(), 5000);
        }

        function ocultarLlegada() {
            $('llegada').style.display = 'none';
            llegadaEventoId = null;
            llegadaTimer = null;
        }

        async function cargarEventos() {
            log('Cargando eventos...');
            const res = await fetch(API_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error(`API ${res.status}`);
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error('API no devolvió array');
            eventosData = data.map(sanitizarEvento).filter(e => esNumero(e.latitud) && esNumero(e.longitud));
            log(`${eventosData.length} eventos cargados`);
            if (eventosData.length === 0) setStatus('Sin eventos hoy');
        }

        function animar() {
            requestAnimationFrame(animar);
            frameCount++;
            actualizarOrientacionCamara();
            actualizarIndicadores();
            if (frameCount % 60 === 0) {
                const acc = gpsAccuracy < 999 ? `±${gpsAccuracy.toFixed(0)}m` : 'sin GPS';
                const heading = esIOS
                    ? (smoothCompassHeading !== null ? smoothCompassHeading.toFixed(0) : (compassHeading ? compassHeading.toFixed(0) : '?'))
                    : lastHeadingDeg.toFixed(0);
                setStatus(`GPS ${acc} · ${heading}° · ${orientationSource}`);
                log(`iOS cam rot: x=${camera.rotation.x.toFixed(2)} y=${camera.rotation.y.toFixed(2)} z=${camera.rotation.z.toFixed(2)}`);
            }
            renderer.render(scene, camera);
        }

        async function iniciar() {
            const btn = $('btn-iniciar');
            btn.disabled = true;
            btn.textContent = 'Iniciando...';
            setStatus('Solicitando permisos...');
            log('Iniciando AR...');
            try {
                await solicitarPermisosSensores();
                await iniciarCamara();
                iniciarThree();
                iniciarGPS();
                await iniciarOrientacion();
                await cargarEventos();
                crearIndicadores();
                btn.style.display = 'none';
                if (!animacionIniciada) { animacionIniciada = true; animar(); }
                log('Listo ✓');
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Reintentar';
                setStatus('Error: ' + err.message);
                log('ERROR: ' + err.message);
            }
        }

        $('btn-iniciar').addEventListener('click', iniciar);
    </script>
</body>
