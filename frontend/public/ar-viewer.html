<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniEventos AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script>
      AFRAME.registerComponent('billboard', {
        tick: function () {
          const camera = document.querySelector('a-camera');
          if (!camera) return;
          const cameraRotation = camera.getAttribute('rotation');
          if (!cameraRotation) return;
          this.el.setAttribute('rotation', {
            x: 0,
            y: cameraRotation.y,
            z: 0
          });
        }
      });
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: black; }
      a-scene {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
      #ui-overlay {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 12px 16px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        z-index: 999;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        pointer-events: none;
      }
      #eventos-overlay {
        position: fixed;
        bottom: 80px;
        left: 16px;
        right: 16px;
        z-index: 999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }
      .evento-card {
        background: rgba(15, 15, 46, 0.92);
        border: 1px solid #6c63ff;
        border-radius: 12px;
        padding: 12px 16px;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        transition: all 0.3s ease;
      }
      .evento-card.cerca {
        border-color: #00ff88;
        background: rgba(0, 255, 136, 0.15);
      }
      .evento-card.lejos {
        opacity: 0.6;
        transform: scale(0.85);
      }
      .evento-titulo {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 4px;
      }
      .evento-lugar {
        font-size: 13px;
        color: #a0a0ff;
        margin-bottom: 4px;
      }
      .evento-hora {
        font-size: 13px;
        color: #80ffcc;
        margin-bottom: 6px;
      }
      .evento-distancia {
        font-size: 14px;
        font-weight: bold;
        color: #ffcc00;
      }
      .evento-llegaste {
        font-size: 14px;
        font-weight: bold;
        color: #00ff88;
      }
      #brujula {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .flecha-evento {
        background: rgba(108, 99, 255, 0.9);
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
      }
      #debug {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.8);
        color: lime;
        font-family: monospace;
        font-size: 10px;
        padding: 6px;
        z-index: 9999;
        max-height: 25vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div style="font-weight:bold; font-size:18px;">🎯 UniEventos AR</div>
      <div id="status" style="font-size:13px; opacity:0.8;">Iniciando...</div>
    </div>

    <div id="eventos-overlay"></div>
    <div id="brujula"></div>
    <div id="debug"></div>

    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; facingMode: environment"
      renderer="antialias: true; alpha: true"
      embedded
    >
      <a-camera gps-projected-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const API_URL = 'https://unieventos-s25a.onrender.com/eventos/ar';
      const DISTANCIA_LLEGADA = 30;
      const DISTANCIA_MAXIMA = 200;

      let miLatitud = null;
      let miLongitud = null;
      let miHeading = 0;
      let eventosData = [];

      function log(msg) {
        const d = document.getElementById('debug');
        d.innerHTML += msg + '<br>';
        d.scrollTop = d.scrollHeight;
      }

      function iniciarBrujula() {
        if (window.DeviceOrientationEvent) {
          window.addEventListener('deviceorientationabsolute', e => {
            if (e.alpha !== null) miHeading = e.alpha;
          }, true);
          window.addEventListener('deviceorientation', e => {
            if (e.webkitCompassHeading !== undefined) {
              miHeading = e.webkitCompassHeading;
            } else if (e.alpha !== null) {
              miHeading = 360 - e.alpha;
            }
          }, true);
        }
      }

      function iniciarGPS() {
        log('Iniciando GPS...');
        navigator.geolocation.watchPosition(pos => {
          miLatitud = pos.coords.latitude;
          miLongitud = pos.coords.longitude;
          log(`GPS ±${pos.coords.accuracy.toFixed(0)}m`);
          document.getElementById('status').textContent = `GPS ±${pos.coords.accuracy.toFixed(0)}m precisión`;
          actualizarUI();
        }, err => {
          log(`ERROR GPS: ${err.message}`);
          navigator.geolocation.getCurrentPosition(pos => {
            miLatitud = pos.coords.latitude;
            miLongitud = pos.coords.longitude;
            actualizarUI();
          }, err2 => {
            document.getElementById('status').textContent = 'No se pudo obtener ubicación';
          }, { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 });
        }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
      }

      function calcularDistancia(lat2, lng2) {
        if (miLatitud === null) return null;
        const R = 6371000;
        const dLat = (lat2 - miLatitud) * Math.PI / 180;
        const dLng = (lng2 - miLongitud) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 +
                  Math.cos(miLatitud * Math.PI/180) *
                  Math.cos(lat2 * Math.PI/180) *
                  Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      }

      function calcularAngulo(lat2, lng2) {
        if (miLatitud === null) return 0;
        const dLng = (lng2 - miLongitud) * Math.PI / 180;
        const lat1 = miLatitud * Math.PI / 180;
        const lat2r = lat2 * Math.PI / 180;
        const y = Math.sin(dLng) * Math.cos(lat2r);
        const x = Math.cos(lat1) * Math.sin(lat2r) - Math.sin(lat1) * Math.cos(lat2r) * Math.cos(dLng);
        const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        return (bearing - miHeading + 360) % 360;
      }

      function formatDistancia(metros) {
        if (metros === null) return '...';
        if (metros < 1000) return `${Math.round(metros)} m`;
        return `${(metros / 1000).toFixed(1)} km`;
      }

      function obtenerFlecha(angulo) {
        if (angulo > 337.5 || angulo <= 22.5) return '⬆️';
        if (angulo <= 67.5) return '↗️';
        if (angulo <= 112.5) return '➡️';
        if (angulo <= 157.5) return '↘️';
        if (angulo <= 202.5) return '⬇️';
        if (angulo <= 247.5) return '↙️';
        if (angulo <= 292.5) return '⬅️';
        return '↖️';
      }

      function actualizarUI() {
        if (miLatitud === null || eventosData.length === 0) return;

        const overlay = document.getElementById('eventos-overlay');
        const brujula = document.getElementById('brujula');
        overlay.innerHTML = '';
        brujula.innerHTML = '';

        eventosData.forEach(evento => {
          const dist = calcularDistancia(evento.latitud, evento.longitud);
          const angulo = calcularAngulo(evento.latitud, evento.longitud);
          const flecha = obtenerFlecha(angulo);

          // Tamaño dinámico según distancia
          let tamanoTitulo = '16px';
          let tamanoTexto = '13px';
          let cardClass = 'evento-card';

          if (dist !== null) {
            if (dist < 50) {
              tamanoTitulo = '20px';
              tamanoTexto = '15px';
              cardClass = 'evento-card cerca';
            } else if (dist < 100) {
              tamanoTitulo = '17px';
              tamanoTexto = '14px';
            } else {
              cardClass = 'evento-card lejos';
            }
          }

          const card = document.createElement('div');
          card.className = cardClass;
          card.innerHTML = `
            <div class="evento-titulo" style="font-size:${tamanoTitulo}">${evento.titulo}</div>
            <div class="evento-lugar" style="font-size:${tamanoTexto}">📍 ${evento.lugar_nombre}</div>
            <div class="evento-hora" style="font-size:${tamanoTexto}">🕐 ${evento.hora_inicio.slice(0,5)} - ${evento.hora_fin.slice(0,5)}</div>
            ${dist !== null && dist < DISTANCIA_LLEGADA
              ? `<div class="evento-llegaste">✅ ¡Ya llegaste!</div>`
              : `<div class="evento-distancia">${flecha} ${formatDistancia(dist)}</div>`
            }
          `;
          overlay.appendChild(card);

          const flechaDiv = document.createElement('div');
          flechaDiv.className = 'flecha-evento';
          flechaDiv.innerHTML = `<span>${flecha}</span>`;
          brujula.appendChild(flechaDiv);
        });
      }

      async function cargarEventos() {
        try {
          log('Cargando eventos...');
          const res = await fetch(API_URL);
          const eventos = await res.json();
          log(`${eventos.length} eventos recibidos`);
          eventosData = eventos;

          if (eventos.length === 0) {
            document.getElementById('status').textContent = 'No hay eventos hoy';
            return;
          }

          document.getElementById('status').textContent = `${eventos.length} evento(s) encontrado(s)`;
          actualizarUI();
          setInterval(actualizarUI, 1000);

        } catch (err) {
          log(`ERROR: ${err.message}`);
          document.getElementById('status').textContent = 'Error cargando eventos';
        }
      }

      document.querySelector('a-scene').addEventListener('loaded', () => {
        log('Escena lista');
        iniciarBrujula();
        iniciarGPS();
        cargarEventos();
      });
    </script>
  </body>
</html>
