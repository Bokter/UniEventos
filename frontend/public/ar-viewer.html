<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>UniEventos AR</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: black; }
      #video {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      #canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      #ui {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 12px 16px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
        z-index: 10;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        pointer-events: none;
      }
      #llegada {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,255,136,0.15);
        border: 2px solid #00ff88;
        border-radius: 16px;
        padding: 20px 32px;
        color: #00ff88;
        font-family: 'Segoe UI', sans-serif;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
        z-index: 10;
        display: none;
        pointer-events: none;
      }
      #debug {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.8);
        color: lime;
        font-family: monospace;
        font-size: 10px;
        padding: 6px;
        z-index: 99;
        max-height: 20vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="ui">
      <div style="font-weight:bold; font-size:18px;">🎯 UniEventos AR</div>
      <div id="status" style="font-size:13px; opacity:0.8;">Iniciando...</div>
    </div>

    <div id="llegada"></div>
    <div id="debug"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const API_URL = 'https://unieventos-s25a.onrender.com/eventos/ar';
      const DIST_LLEGADA = 30;
      const DIST_MAXIMA = 500;
      const DIST_ESCALA_MAX = 50;
      const DIST_ESCALA_MIN = 200;

      let miLat = null, miLng = null;
      let heading = 0;
      let pitch = 0;
      let eventosData = [];
      let renderer, scene, camera;
      let indicadores = [];

      function log(msg) {
        const d = document.getElementById('debug');
        d.innerHTML += msg + '<br>';
        d.scrollTop = d.scrollHeight;
      }

      // ── Cámara trasera ──
      async function iniciarCamara() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          document.getElementById('video').srcObject = stream;
          log('Cámara OK');
        } catch (e) {
          log('ERROR cámara: ' + e.message);
          // fallback sin exact
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            document.getElementById('video').srcObject = stream;
            log('Cámara fallback OK');
          } catch (e2) {
            log('ERROR cámara fallback: ' + e2.message);
          }
        }
      }

      // ── GPS ──
      function iniciarGPS() {
        navigator.geolocation.watchPosition(pos => {
          miLat = pos.coords.latitude;
          miLng = pos.coords.longitude;
          document.getElementById('status').textContent = `GPS ±${pos.coords.accuracy.toFixed(0)}m`;
          log(`GPS: ${miLat.toFixed(5)}, ${miLng.toFixed(5)} ±${pos.coords.accuracy.toFixed(0)}m`);
          actualizarPosiciones();
        }, err => {
          log('ERROR GPS: ' + err.message);
          navigator.geolocation.getCurrentPosition(pos => {
            miLat = pos.coords.latitude;
            miLng = pos.coords.longitude;
            actualizarPosiciones();
          }, () => {}, { enableHighAccuracy: false, timeout: 30000 });
        }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
      }

      // ── Orientación del dispositivo ──
      function iniciarOrientacion() {
        const handler = (e) => {
          if (e.webkitCompassHeading !== undefined) {
            heading = e.webkitCompassHeading;
          } else if (e.absolute && e.alpha !== null) {
            heading = (360 - e.alpha) % 360;
          } else if (e.alpha !== null) {
            heading = (360 - e.alpha) % 360;
          }
          pitch = e.beta || 0;
        };

        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          // iOS 13+
          DeviceOrientationEvent.requestPermission().then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handler, true);
              log('Orientación iOS OK');
            }
          }).catch(log);
        } else {
          window.addEventListener('deviceorientationabsolute', handler, true);
          window.addEventListener('deviceorientation', handler, true);
          log('Orientación Android OK');
        }
      }

      // ── Three.js ──
      function iniciarThree() {
        const canvas = document.getElementById('canvas');
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        scene.add(camera);

        window.addEventListener('resize', () => {
          renderer.setSize(window.innerWidth, window.innerHeight);
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
        });

        log('Three.js OK');
        animar();
      }

      // ── Cálculos GPS ──
      function calcularDistancia(lat2, lng2) {
        if (miLat === null) return null;
        const R = 6371000;
        const dLat = (lat2 - miLat) * Math.PI / 180;
        const dLng = (lng2 - miLng) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 +
                  Math.cos(miLat * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                  Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      }

      function calcularBearing(lat2, lng2) {
        const dLng = (lng2 - miLng) * Math.PI / 180;
        const lat1 = miLat * Math.PI / 180;
        const lat2r = lat2 * Math.PI / 180;
        const y = Math.sin(dLng) * Math.cos(lat2r);
        const x = Math.cos(lat1) * Math.sin(lat2r) - Math.sin(lat1) * Math.cos(lat2r) * Math.cos(dLng);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      }

      // ── Crear indicador 3D con canvas texture ──
      function crearIndicador(evento) {
        const group = new THREE.Group();

        // Crear textura con canvas 2D
        const canvasTex = document.createElement('canvas');
        canvasTex.width = 512;
        canvasTex.height = 256;
        const ctx = canvasTex.getContext('2d');

        function dibujarCard(dist) {
          ctx.clearRect(0, 0, 512, 256);

          // Fondo
          ctx.fillStyle = 'rgba(15, 15, 46, 0.92)';
          ctx.beginPath();
          ctx.roundRect(4, 4, 504, 248, 20);
          ctx.fill();

          // Borde
          ctx.strokeStyle = dist !== null && dist < 50 ? '#00ff88' : '#6c63ff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(4, 4, 504, 248, 20);
          ctx.stroke();

          // Línea superior
          ctx.fillStyle = dist !== null && dist < 50 ? '#00ff88' : '#6c63ff';
          ctx.fillRect(4, 4, 504, 8);

          // Título
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 36px Segoe UI, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(evento.titulo, 256, 70);

          // Lugar
          ctx.fillStyle = '#a0a0ff';
          ctx.font = '26px Segoe UI, sans-serif';
          ctx.fillText(`📍 ${evento.lugar_nombre}`, 256, 115);

          // Hora
          ctx.fillStyle = '#80ffcc';
          ctx.font = '24px Segoe UI, sans-serif';
          ctx.fillText(`🕐 ${evento.hora_inicio.slice(0,5)} - ${evento.hora_fin.slice(0,5)}`, 256, 155);

          // Distancia
          if (dist !== null && dist < DIST_LLEGADA) {
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 28px Segoe UI, sans-serif';
            ctx.fillText('✅ ¡Ya llegaste!', 256, 210);
          } else {
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 28px Segoe UI, sans-serif';
            const distTexto = dist !== null
              ? (dist < 1000 ? `${Math.round(dist)} m` : `${(dist/1000).toFixed(1)} km`)
              : '...';
            ctx.fillText(distTexto, 256, 210);
          }
        }

        dibujarCard(null);

        const texture = new THREE.CanvasTexture(canvasTex);
        const geo = new THREE.PlaneGeometry(4, 2);
        const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geo, mat);
        group.add(mesh);

        group.userData = { evento, canvasTex, ctx, texture, dibujarCard };
        scene.add(group);
        return group;
      }

      // ── Actualizar posiciones según GPS y orientación ──
      function actualizarPosiciones() {
        if (miLat === null || eventosData.length === 0) return;

        indicadores.forEach(({ group, evento }) => {
          const dist = calcularDistancia(evento.latitud, evento.longitud);
          const bearing = calcularBearing(evento.latitud, evento.longitud);

          // Actualizar card texture
          const { dibujarCard, texture } = group.userData;
          dibujarCard(dist);
          texture.needsUpdate = true;

          // Ocultar si está fuera de rango
          if (dist === null || dist > DIST_MAXIMA) {
            group.visible = false;
            return;
          }

          if (dist < DIST_LLEGADA) {
            group.visible = false;
            document.getElementById('llegada').style.display = 'block';
            document.getElementById('llegada').textContent = `✅ ¡Llegaste a\n${evento.titulo}!`;
            return;
          }

          group.visible = true;
          document.getElementById('llegada').style.display = 'none';

          // Calcular ángulo relativo al heading del usuario
          const anguloRelativo = (bearing - heading + 360) % 360;
          const anguloRad = (anguloRelativo - 90) * Math.PI / 180;

          const radio = 8; // distancia fija en el espacio 3D
          const x = Math.cos(anguloRad) * radio;
          const z = Math.sin(anguloRad) * radio;
          const y = 0;

          group.position.set(x, y, z);

          // Escala según distancia
          const t = Math.max(0, Math.min(1, (dist - DIST_ESCALA_MAX) / (DIST_ESCALA_MIN - DIST_ESCALA_MAX)));
          const escala = 1.5 - t * 1.0; // entre 1.5 (cerca) y 0.5 (lejos)
          group.scale.setScalar(escala);

          // Siempre mirar al centro (donde está la cámara)
          group.lookAt(0, 0, 0);
        });
      }

      // ── Loop de animación ──
      function animar() {
        requestAnimationFrame(animar);
        actualizarPosiciones();
        renderer.render(scene, camera);
      }

      // ── Cargar eventos ──
      async function cargarEventos() {
        try {
          log('Cargando eventos...');
          const res = await fetch(API_URL);
          const eventos = await res.json();
          log(`${eventos.length} eventos recibidos`);
          eventosData = eventos;

          if (eventos.length === 0) {
            document.getElementById('status').textContent = 'No hay eventos hoy';
            return;
          }

          eventos.forEach(evento => {
            const group = crearIndicador(evento);
            group.visible = false;
            indicadores.push({ group, evento });
          });

          document.getElementById('status').textContent = `${eventos.length} evento(s) encontrado(s)`;

        } catch (err) {
          log('ERROR API: ' + err.message);
          document.getElementById('status').textContent = 'Error cargando eventos';
        }
      }

      // ── Init ──
      async function init() {
        await iniciarCamara();
        iniciarGPS();
        iniciarOrientacion();
        iniciarThree();
        await cargarEventos();
      }

      init();
    </script>
  </body>
</html>
