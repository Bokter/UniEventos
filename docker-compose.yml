services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_EMAILJS_SERVICE_ID=${VITE_EMAILJS_SERVICE_ID}
        - VITE_EMAILJS_TEMPLATE_ID=${VITE_EMAILJS_TEMPLATE_ID}
        - VITE_EMAILJS_PUBLIC_KEY=${VITE_EMAILJS_PUBLIC_KEY}
    expose:
      - "5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  backend:
    build: ./backend
    expose:
      - "3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_SSL=${DB_SSL}
      - DB_USER=${DB_USER}
      - NODE_ENV=${NODE_ENV}
      - TZ=${TZ}
      - JWT_SECRET=${JWT_SECRET}
    command: sh -c "npm run build && npx typeorm-ts-node-commonjs migration:run -d src/config/data-source.ts && node dist/main.js"
